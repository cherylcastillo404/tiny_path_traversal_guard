[project]
name = "tiny-path-traversal-guard"
version = "0.1.0"
description = "Checks a resolved file path is inside a given base directory, rejecting traversal."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
